<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Iniciar sesión</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-icon">✓</span>
        <h1>TaskFlow</h1>
      </div>
      <p class="subtitle">Organiza tus tareas de forma simple</p>

      <div class="tabs">
        <button class="tab-btn active" id="tabLoginBtn">Iniciar sesión</button>
        <button class="tab-btn" id="tabRegisterBtn">Registrarse</button>
      </div>

      <!-- FORMULARIO LOGIN -->
      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Correo electrónico</label>
        <input type="email" id="loginEmail" required placeholder="tucorreo@ejemplo.com">

        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">

        <button type="submit" class="btn-primary">Entrar</button>
        <p class="form-message" id="loginMessage"></p>
      </form>

      <!-- FORMULARIO REGISTRO -->
      <form id="registerForm" class="auth-form hidden">
        <label for="registerName">Nombre completo</label>
        <input type="text" id="registerName" required placeholder="Tu nombre">

        <label for="registerEmail">Correo electrónico</label>
        <input type="email" id="registerEmail" required placeholder="tucorreo@ejemplo.com">

        <label for="registerPassword">Contraseña</label>
        <input type="password" id="registerPassword" required placeholder="Mínimo 8 caracteres" minlength="8">

        <button type="submit" class="btn-primary">Crear cuenta</button>
        <p class="form-message" id="registerMessage"></p>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
